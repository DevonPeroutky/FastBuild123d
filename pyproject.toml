[project]
name = "fastbuild123"
version = "0.1.0"
description = "Turn any build123d model into a live, interactive parametric web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "annotated-types>=0.6",
    "build123d>=0.8.0",
    "fastapi>=0.115",
    "ocp-tessellate>=3.4",
    "pydantic>=2",
    "uvicorn[standard]>=0.30",
    "watchfiles>=1.1.1",
]

[project.scripts]
fastbuild = "fastbuild.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastbuild"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
